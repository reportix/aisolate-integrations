[workspace]
name = "aisolate-knime"
channels = ["knime", "conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64", "win-64"]

[dependencies]
python = "3.12.*"
knime-python-base = "5.12.*"
knime-extension = "5.12.*"
# KNIME 5.12's docstring renderer imports markdown.inlinepatterns.AsteriskProcessor, gone in 3.11
markdown = "3.10.*"

[feature.test.dependencies]
pytest = "*"

[environments]
test = ["test"]

[tasks]
test = "python -m pytest -q tests"
